  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://a2a-protocol.org/#website",
        "url": "https://a2a-protocol.org/",
        "name": "A2A Protocol",
        "alternateName": "Agent2Agent Protocol",

        "inLanguage": "en",
        "publisher": { "@id": "https://a2a-protocol.org/#organization" }
      },
      {
        "@type": "Organization",
        "@id": "https://a2a-protocol.org/#organization",

        "url": "https://a2a-protocol.org/",
        "logo": "https://a2a-protocol.org/latest/assets/a2a_logo/icon/color/SVG/a2a_icon_color.svg",

          "https://discord.gg/a2aprotocol",
          "https://www.linuxfoundation.org/"
        ]
      }
    ]
  }
  </script>

  {% if config.extra.dev_livereload %}
  <script>
    (function () {
      var epoch = 0;
      var primed = false;
      function poll() {
        var req = new XMLHttpRequest();
        req.onloadend = function () {
          var next = parseFloat(this.responseText);
          if (!primed) {
            primed = true;
            if (!isNaN(next)) {
              epoch = next;
            }
            poll();
            return;
          }
          if (next > epoch) {
            window.location.reload();
            return;
          }
          setTimeout(poll, this.status === 200 ? 0 : 3000);
        };
        req.open("GET", "/livereload/" + epoch + "/" + Date.now());
        req.send();
      }
      poll();
    })();
  </script>
  {% endif %}
{% endblock %}
