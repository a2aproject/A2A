acts_version: "1.0"
spec_version: "1.1"
metadata:
  title: "Agent Card Discovery"
  description: "Tests for A2A agent card discovery and structure"

suites:
  - id: discovery
    name: Agent Card Discovery
    tests:
      - id: CARD-DISC-001
        name: Agent card is discoverable
        description: Agent card is discoverable at the well-known URL and exposes core metadata.
        spec_ref: Agent Card Discovery
        level: must
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              body:
                name:
                  exists: true
                version:
                  exists: true
                description:
                  exists: true

      - id: CARD-DISC-002
        name: Agent card contains supported interfaces
        description: Agent card lists one or more supported interfaces with binding and version metadata.
        spec_ref: Agent Card Discovery
        level: must
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              body:
                supportedInterfaces:
                  type: array
                  count_gte: 1
                  items:
                    url:
                      type: string
                    protocolBinding:
                      one_of:
                        - JSONRPC
                        - GRPC
                        - HTTP+JSON
                    protocolVersion:
                      type: string

      - id: CARD-DISC-003
        name: Agent card contains capabilities
        description: Agent card exposes capabilities as an object.
        spec_ref: Agent Card Discovery
        level: must
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              body:
                capabilities:
                  exists: true
                  type: object

      - id: CARD-DISC-004
        name: Agent card contains skills
        description: Agent card includes skills with identifiers and names.
        spec_ref: Agent Card Discovery
        level: should
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              body:
                skills:
                  type: array
                  items:
                    id:
                      exists: true
                    name:
                      exists: true

      - id: CARD-DISC-005
        name: Agent card contains default input and output modes
        description: Agent card includes default input and output mode arrays.
        spec_ref: Agent Card Discovery
        level: should
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              body:
                defaultInputModes:
                  type: array
                defaultOutputModes:
                  type: array

      - id: CARD-DISC-006
        name: Agent card protocolVersion matches spec version
        description: The first supported interface advertises an A2A 1.x protocol version.
        spec_ref: Agent Card Discovery
        level: must
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              body:
                supportedInterfaces:
                  type: array
                  count_gte: 1
                  items:
                    - protocolVersion:
                        starts_with: "1."

      - id: CARD-CACHE-001
        name: Agent card caching headers
        description: >
          Verifies the agent card response carries both caching headers §8.6.1
          asks for. They are two independent SHOULD requirements, so satisfying one and
          omitting the other is not conformance. `Last-Modified` is a MAY and
          is deliberately not asserted.
        spec_ref: "specification.md#8.6.1"
        level: should
        tags: [discovery, caching]
        runner_requirements: [header_inspection]
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              headers:
                all_of:
                  - Cache-Control:
                      contains: "max-age"
                  - ETag:
                      type: string
              body:
                name:
                  exists: true

      - id: CARD-SCHEMA-001
        name: Agent card validates against schema
        description: Runner MUST validate response against A2A AgentCard JSON Schema.
        spec_ref: Agent Card Discovery
        level: should
        tags: [discovery, schema-validation]
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              body:
                name:
                  exists: true
                capabilities:
                  type: object

      - id: CARD-EXT-001
        name: Extended agent card
        description: Retrieves the extended agent card when the capability is advertised.
        spec_ref: Get Extended Agent Card
        level: may
        preconditions:
          capabilities:
            extendedAgentCard: true
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_extended_agent_card
            params: {}
            expect:
              status: 200
              body:
                skills:
                  type: array
                  count_gte: 1
                description:
                  matches: ".+"

      - id: CARD-DISC-007
        name: Agent card declares all supported protocols
        description: Verifies that the public Agent Card declares every protocol endpoint it serves in supportedInterfaces.
        spec_ref: REQ-BIND-002
        level: must
        requires_behaviors: []
        steps:
          - id: step-1
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              body:
                supportedInterfaces:
                  type: array
                  count_gte: 1

      - id: CARD-DISC-008
        name: Agent card lists an interface with protocolVersion 1.1
        description: >
          The A2A text asks an agent to declare the latest minor version it supports
          for each major version in the protocolVersion of an interface. An agent
          that serves A2A 1.1 therefore lists an interface with protocolVersion
          "1.1". The test reads the public agent card and looks for one.
        spec_ref: "specification/a2a.proto: message AgentInterface"
        level: should
        min_spec_version: "1.1"
        tags: [discovery, versioning]
        steps:
          - id: card
            operation: get_agent_card
            params: {}
            expect:
              status: 200
              body:
                supportedInterfaces:
                  type: array
                  count_gte: 1
            assertions:
              - id: lists-1-1
                description: "At least one interface declares protocolVersion 1.1"
                source: "{{card.response}}"
                any:
                  path: "supportedInterfaces[*]"
                  match:
                    protocolVersion: "1.1"

      - id: CARD-ROOT-001
        name: Agent card is served at the interface URL
        description: >
          A pending change to the A2A text recommends that a server answer an HTTP
          GET on its interface URL with the public agent card, so that a client
          that knows the URL does not need the well-known path. The test fetches
          the card from the well-known path, then sends GET to the interface URL
          and expects the same card. It is at may level and tentative: the
          recommendation is not in the 1.1.0 release candidate. The pending text
          lets a server require authentication for this endpoint, so the test
          applies only to an agent that declares none.
        spec_ref: "docs/specification.md#81-purpose"
        level: may
        min_spec_version: "1.1"
        tags: [discovery, tentative]
        origin: "https://github.com/a2aproject/A2A/pull/2378"
        transport: [jsonrpc, rest]
        preconditions:
          authentication: false
        steps:
          - id: well-known
            operation: get_agent_card
            params: {}
            capture:
              cardName: name
            expect:
              status: 200
              body:
                name:
                  type: string
          - id: root
            raw:
              method: GET
              path: "/"
              headers:
                Accept: application/json
                A2A-Version: "{{specVersion}}"
            expect:
              status: 200
              body:
                name: "{{well-known.cardName}}"
                supportedInterfaces:
                  type: array
                  count_gte: 1
