acts_version: "1.0"
spec_version: "1.0"

metadata:
  title: "A2A Transport Binding Conformance Tests"
  description: "Transport-specific ACTS coverage for JSON-RPC, REST, and gRPC bindings."

suites:
  - id: jsonrpc-transport
    name: "JSON-RPC transport bindings"
    tests:
      - id: JSONRPC-ENV-001
        name: "Response has valid JSON-RPC 2.0 envelope"
        level: must
        tags: [transport, jsonrpc, raw, envelope]
        transport: [jsonrpc]
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: send-raw
            raw:
              method: POST
              path: "/"
              headers:
                Content-Type: application/json
                A2A-Version: "1.0"
              body:
                jsonrpc: "2.0"
                id: "jsonrpc-env-001"
                method: SendMessage
                params:
                  message:
                    messageId: "jsonrpc-env-001-msg"
                    role: ROLE_USER
                    parts:
                      - text: "tck-complete-task verify jsonrpc envelope"
            expect:
              status: 200
              body:
                jsonrpc: "2.0"
                id: "jsonrpc-env-001"
                result:
                  exists: true

      - id: JSONRPC-CT-001
        name: "Response Content-Type is application/json"
        description: "Verifies the JSON-RPC binding answers with the application/json content type."
        level: must
        tags: [transport, jsonrpc, raw, content-type]
        transport: [jsonrpc]
        runner_requirements: [header_inspection]
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: send-raw
            raw:
              method: POST
              path: "/"
              headers:
                Content-Type: application/json
                A2A-Version: "1.0"
              body:
                jsonrpc: "2.0"
                id: "jsonrpc-ct-001"
                method: SendMessage
                params:
                  message:
                    messageId: "jsonrpc-ct-001-msg"
                    role: ROLE_USER
                    parts:
                      - text: "tck-complete-task verify content type"
            expect:
              status: 200
              headers:
                Content-Type:
                  starts_with: "application/json"
              body:
                jsonrpc: "2.0"
                id: "jsonrpc-ct-001"
                result:
                  exists: true

      - id: JSONRPC-SSE-001
        name: "SSE streaming events have JSON-RPC envelope"
        level: must
        tags: [transport, jsonrpc, raw, sse, streaming]
        transport: [jsonrpc]
        requires_behaviors: ["tck-stream-basic"]
        preconditions:
          capabilities:
            streaming: true
        steps:
          - id: stream-raw
            raw:
              method: POST
              path: "/"
              headers:
                Content-Type: application/json
                Accept: text/event-stream
                A2A-Version: "1.0"
              body:
                jsonrpc: "2.0"
                id: "jsonrpc-sse-001"
                method: SendStreamingMessage
                params:
                  message:
                    messageId: "jsonrpc-sse-001-msg"
                    role: ROLE_USER
                    parts:
                      - text: "tck-stream-basic generate output"
            expect:
              status: 200
            expect_stream:
              min_count: 2
              each_event:
                jsonrpc: "2.0"

  - id: rest-transport
    name: "REST transport bindings"
    tests:
      - id: REST-STATUS-001
        name: "REST errors map to correct HTTP status codes"
        level: must
        tags: [transport, rest, raw, status]
        transport: [rest]
        steps:
          - id: get-missing
            raw:
              method: GET
              path: "/tasks/nonexistent-id"
              headers:
                Accept: application/json
                A2A-Version: "1.0"
            expect:
              status: 404

      - id: REST-PD-001
        name: "REST errors use the google.rpc.Status representation"
        description: "Verifies that a REST error body is a google.rpc.Status object whose details array carries an ErrorInfo naming the A2A error type."
        level: should
        tags: [transport, rest, raw, error-format]
        transport: [rest]
        steps:
          - id: get-missing-problem
            raw:
              method: GET
              path: "/tasks/nonexistent-id"
              headers:
                Accept: application/json
                A2A-Version: "1.0"
            expect:
              status: 404
              body:
                error:
                  code:
                    type: number
                  message:
                    type: string
                  details:
                    type: array
                    count_gte: 1
            assertions:
              - source: "{{get-missing-problem.response}}"
                any:
                  path: "error.details[*]"
                  match:
                    "@type":
                      contains: "ErrorInfo"
                    reason: "TASK_NOT_FOUND"
                    domain: "a2a-protocol.org"

      - id: REST-CT-001
        name: "REST responses use application/a2a+json content type"
        description: "Verifies the Content-Type response header is application/a2a+json for REST responses."
        level: should
        tags: [transport, content-type]
        transport: [rest]
        runner_requirements: [header_inspection]
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: send
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-complete-task verify rest content type"
            expect:
              status: 200
              headers:
                Content-Type:
                  starts_with: "application/a2a+json"
              body:
                task:
                  id:
                    type: string
                  status:
                    state: TASK_STATE_COMPLETED

  - id: grpc-transport
    name: "gRPC transport bindings"
    tests:
      - id: GRPC-STATUS-001
        name: "gRPC errors map to correct status codes"
        description: "Verifies that missing-task errors surface through the gRPC binding with the expected status semantics (for example, NOT_FOUND) even though the ACTS assertion is expressed as an abstract TaskNotFoundError."
        level: must
        tags: [transport, grpc, grpc-status-verification]
        transport: [grpc]
        steps:
          - id: get-missing
            operation: get_task
            params:
              id: "00000000-0000-0000-0000-000000000000"
            expect_error:
              error_type: TaskNotFoundError

      - id: GRPC-STREAM-001
        name: "gRPC streaming delivers proper message structure"
        level: must
        tags: [transport, grpc, streaming]
        transport: [grpc]
        requires_behaviors: ["tck-stream-basic"]
        preconditions:
          capabilities:
            streaming: true
        steps:
          - id: stream
            operation: send_streaming_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-stream-basic generate output"
            expect_stream:
              min_count: 2

      - id: GRPC-STREAM-002
        name: "gRPC streaming cancellation works"
        level: should
        tags: [transport, grpc, streaming, cancel]
        transport: [grpc]
        requires_behaviors: ["tck-cancel"]
        steps:
          - id: start
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-cancel start"
              configuration:
                returnImmediately: true
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string
                  status:
                    state:
                      one_of:
                        - TASK_STATE_SUBMITTED
                        - TASK_STATE_WORKING
            capture:
              taskId: "task.id"

          - id: cancel
            operation: cancel_task
            params:
              id: "{{start.taskId}}"
            expect:
              status: 200
              body:
                id: "{{start.taskId}}"
                status:
                  state: TASK_STATE_CANCELED
