acts_version: "1.0"
spec_version: "1.1"

metadata:
  title: "Client Parsing (Golden Response) Tests"
  description: >
    These tests verify that SDK clients can correctly parse canonical A2A
    wire payloads. Each test provides a golden JSON response and asserts
    that the client SDK parses it into the expected object structure.

suites:
  - id: client-parsing
    name: "Client Parsing (Golden Responses)"
    tests:
      - id: CLIENT-PARSE-001
        name: "Parse SendMessage response with completed task"
        description: >
          Verifies the SDK client can parse a SendMessage response containing
          a completed task with artifacts.
        level: must
        tags: [client, parsing, task]
        steps:
          - id: parse
            client_response:
              operation: send_message
              wire_payload:
                jsonrpc: "2.0"
                id: "req-001"
                result:
                  task:
                    id: "task-abc-123"
                    contextId: "ctx-001"
                    status:
                      state: TASK_STATE_COMPLETED
                      timestamp: "2025-05-25T20:00:00Z"
                    artifacts:
                      - artifactId: "art-1"
                        parts:
                          - text: "hello world"
            expect_parsed:
              task:
                id: "task-abc-123"
                contextId: "ctx-001"
                status:
                  state: TASK_STATE_COMPLETED
                artifacts:
                  count_gte: 1

      - id: CLIENT-PARSE-002
        name: "Parse SendMessage response with message (no task)"
        description: >
          Verifies the SDK client can parse a SendMessage response containing
          a direct message (no task created).
        level: must
        tags: [client, parsing, message]
        steps:
          - id: parse
            client_response:
              operation: send_message
              wire_payload:
                jsonrpc: "2.0"
                id: "req-002"
                result:
                  message:
                    messageId: "msg-001"
                    role: ROLE_AGENT
                    parts:
                      - text: "I can help with that"
            expect_parsed:
              message:
                messageId: "msg-001"
                role: ROLE_AGENT
                parts:
                  count_gte: 1

      - id: CLIENT-PARSE-003
        name: "Parse GetTask response"
        description: >
          Verifies the SDK client can parse a GetTask response with full
          task state including history and artifacts.
        level: must
        tags: [client, parsing, get-task]
        steps:
          - id: parse
            client_response:
              operation: get_task
              wire_payload:
                jsonrpc: "2.0"
                id: "req-003"
                result:
                  id: "task-xyz-789"
                  contextId: "ctx-002"
                  status:
                    state: TASK_STATE_COMPLETED
                    timestamp: "2025-05-25T20:05:00Z"
                  artifacts:
                    - artifactId: "art-1"
                      parts:
                        - text: "result text"
                    - artifactId: "art-2"
                      parts:
                        - data:
                            key: value
                  history:
                    - messageId: "msg-hist-1"
                      role: ROLE_USER
                      parts:
                        - text: "original request"
                    - messageId: "msg-hist-2"
                      role: ROLE_AGENT
                      parts:
                        - text: "processing..."
            expect_parsed:
              id: "task-xyz-789"
              contextId: "ctx-002"
              status:
                state: TASK_STATE_COMPLETED
              artifacts:
                count_gte: 2
              history:
                count_gte: 2

      - id: CLIENT-PARSE-004
        name: "Parse error response"
        description: >
          Verifies the SDK client can parse a JSON-RPC error response and
          surface the A2A error code and message.
        level: must
        tags: [client, parsing, error]
        steps:
          - id: parse
            client_response:
              operation: get_task
              wire_payload:
                jsonrpc: "2.0"
                id: "req-004"
                error:
                  code: -32001
                  message: "Task not found"
                  data:
                    - "@type": "type.googleapis.com/google.rpc.ErrorInfo"
                      reason: "TASK_NOT_FOUND"
                      domain: "a2a-protocol.org"
                      metadata:
                        taskId: "nonexistent-task-id"
            expect_parsed:
              error:
                code: -32001
                message:
                  contains: "not found"

      - id: CLIENT-PARSE-005
        name: "Parse task with INPUT_REQUIRED state"
        description: >
          Verifies the SDK client correctly parses a task in INPUT_REQUIRED
          state with a status message prompting for more input.
        level: must
        tags: [client, parsing, input-required]
        steps:
          - id: parse
            client_response:
              operation: send_message
              wire_payload:
                jsonrpc: "2.0"
                id: "req-005"
                result:
                  task:
                    id: "task-multi-001"
                    contextId: "ctx-multi-001"
                    status:
                      state: TASK_STATE_INPUT_REQUIRED
                      timestamp: "2025-05-25T20:10:00Z"
                      message:
                        messageId: "status-msg-001"
                        role: ROLE_AGENT
                        parts:
                          - text: "Please provide more details"
            expect_parsed:
              task:
                id: "task-multi-001"
                status:
                  state: TASK_STATE_INPUT_REQUIRED
                  message:
                    role: ROLE_AGENT
                    parts:
                      count_gte: 1

      - id: CLIENT-PARSE-006
        name: "Parse task with mixed artifact types"
        description: >
          Verifies the SDK client can parse artifacts containing text, data,
          file, and fileUrl parts in a single response.
        level: should
        tags: [client, parsing, artifacts, data-types]
        steps:
          - id: parse
            client_response:
              operation: get_task
              wire_payload:
                jsonrpc: "2.0"
                id: "req-006"
                result:
                  id: "task-mixed-001"
                  contextId: "ctx-mixed-001"
                  status:
                    state: TASK_STATE_COMPLETED
                    timestamp: "2025-05-25T20:15:00Z"
                  artifacts:
                    - artifactId: "art-text"
                      parts:
                        - text: "Plain text result"
                    - artifactId: "art-data"
                      parts:
                        - data:
                            temperature: 72.5
                            unit: "fahrenheit"
                    - artifactId: "art-file"
                      parts:
                        - raw: "JVBERi0xLjQ="
                          filename: "report.pdf"
                          mediaType: "application/pdf"
                    - artifactId: "art-url"
                      parts:
                        - url: "https://example.com/report.pdf"
                          filename: "report.pdf"
                          mediaType: "application/pdf"
            expect_parsed:
              id: "task-mixed-001"
              artifacts:
                count_gte: 4

      - id: CLIENT-AUTH-001
        name: "Client replaces cached public card with extended card"
        description: "Runner SHOULD verify that after fetching an extended Agent Card, the client uses the extended capabilities for the authenticated session."
        spec_ref: "REQ-AGENTCARD-EXT-002"
        level: should
        tags: [client, discovery, runner-special]
        steps:
          - id: parse-public-card
            client_response:
              operation: get_agent_card
              wire_payload:
                name: "Example Agent"
                description: "An agent that publishes an extended card to authenticated clients."
                version: "1.0.0"
                capabilities:
                  streaming: false
                  extendedAgentCard: true
                defaultInputModes: ["text/plain"]
                defaultOutputModes: ["text/plain"]
                skills:
                  - id: "public-skill"
                    name: "Public Skill"
                    description: "A skill listed on the public card."
                    tags: ["public"]
                supportedInterfaces:
                  - url: "https://example.com/a2a/v1"
                    protocolBinding: HTTP+JSON
                    protocolVersion: "1.0"
            expect_parsed:
              capabilities:
                extendedAgentCard: true

          - id: parse-extended-card
            client_response:
              operation: get_extended_agent_card
              wire_payload:
                name: "Example Agent"
                description: "An agent that publishes an extended card to authenticated clients."
                version: "1.0.0"
                capabilities:
                  streaming: true
                  extendedAgentCard: true
                defaultInputModes: ["text/plain"]
                defaultOutputModes: ["text/plain"]
                skills:
                  - id: "public-skill"
                    name: "Public Skill"
                    description: "A skill listed on the public card."
                    tags: ["public"]
                  - id: "extended-skill"
                    name: "Extended Skill"
                    description: "A skill revealed only to an authenticated client."
                    tags: ["extended"]
                supportedInterfaces:
                  - url: "https://example.com/a2a/v1"
                    protocolBinding: HTTP+JSON
                    protocolVersion: "1.0"
            expect_parsed:
              capabilities:
                streaming: true
                extendedAgentCard: true
              skills:
                count_gte: 1

      - id: CLIENT-CAP-001
        name: "Client checks Agent Card before using optional capabilities"
        description: "Runner SHOULD verify that the client checks Agent Card capabilities before calling optional operations."
        spec_ref: "REQ-CAP-002"
        level: should
        tags: [client, capabilities, runner-special]
        steps:
          - id: parse-card
            client_response:
              operation: get_agent_card
              wire_payload:
                name: "Capability Gated Agent"
                description: "An agent that advertises no optional capabilities."
                version: "1.0.0"
                capabilities:
                  streaming: false
                  pushNotifications: false
                defaultInputModes: ["text/plain"]
                defaultOutputModes: ["text/plain"]
                skills:
                  - id: "basic-skill"
                    name: "Basic Skill"
                    description: "The agent's only skill."
                    tags: ["basic"]
                supportedInterfaces:
                  - url: "https://example.com/a2a/v1"
                    protocolBinding: HTTP+JSON
                    protocolVersion: "1.0"
            expect_parsed:
              capabilities:
                streaming: false
                pushNotifications: false

      - id: CLIENT-PARSE-007
        name: "Parse a task with the A2A 1.1 generation, timeline and artifact fields"
        description: >
          Verifies the client can parse a GetTask response that carries the fields
          A2A 1.1 adds: the task generation, a timeline with a client message entry
          and two agent status entries, and artifacts with startGeneration,
          endGeneration and role. The 64-bit values arrive as strings, as ProtoJSON
          writes them, and are asserted with numeric comparisons so that a client
          may hold them as numbers.
        spec_ref: "docs/specification.md#328-task-timeline-semantics"
        level: must
        min_spec_version: "1.1"
        tags: [client, parsing, get-task, generation, timeline]
        steps:
          - id: parse
            client_response:
              operation: get_task
              wire_payload:
                jsonrpc: "2.0"
                id: "req-007"
                result:
                  id: "task-gen-001"
                  contextId: "ctx-gen-001"
                  status:
                    state: TASK_STATE_COMPLETED
                    timestamp: "2026-01-01T00:00:05Z"
                  artifacts:
                    - artifactId: "art-agent"
                      parts:
                        - text: "agent output"
                      startGeneration: "4"
                      endGeneration: "4"
                      role: ROLE_AGENT
                    - artifactId: "art-user"
                      parts:
                        - text: "client input"
                      startGeneration: "5"
                      endGeneration: "5"
                      role: ROLE_USER
                  timeline:
                    - message:
                        messageId: "msg-tl-1"
                        role: ROLE_USER
                        parts:
                          - text: "please start"
                      generation: "2"
                    - status:
                        state: TASK_STATE_WORKING
                        message:
                          messageId: "msg-tl-2"
                          role: ROLE_AGENT
                          parts:
                            - text: "working on it"
                        timestamp: "2026-01-01T00:00:01Z"
                      generation: "3"
                    - status:
                        state: TASK_STATE_COMPLETED
                        timestamp: "2026-01-01T00:00:05Z"
                      generation: "6"
                  generation: "6"
            expect_parsed:
              id: "task-gen-001"
              contextId: "ctx-gen-001"
              generation: {gte: 6, lte: 6}
              status:
                state: TASK_STATE_COMPLETED
              artifacts:
                - artifactId: "art-agent"
                  startGeneration: {gte: 4, lte: 4}
                  endGeneration: {gte: 4, lte: 4}
                  role: ROLE_AGENT
                - artifactId: "art-user"
                  startGeneration: {gte: 5, lte: 5}
                  endGeneration: {gte: 5, lte: 5}
                  role: ROLE_USER
              timeline:
                - message:
                    messageId: "msg-tl-1"
                    role: ROLE_USER
                  generation: {gte: 2, lte: 2}
                - status:
                    state: TASK_STATE_WORKING
                    message:
                      messageId: "msg-tl-2"
                      role: ROLE_AGENT
                  generation: {gte: 3, lte: 3}
                - status:
                    state: TASK_STATE_COMPLETED
                  generation: {gte: 6, lte: 6}

      - id: CLIENT-PARSE-008
        name: "Client skips a stream event of an unknown kind and keeps reading"
        description: >
          Verifies that a client which receives a stream event of a kind it does
          not know skips that event and goes on reading. The stream carries a task
          snapshot, an event of a kind no A2A version defines, and a status update
          that completes the task. The client must surface the snapshot and the
          status update, in that order, and nothing in between. A client that
          fails on the unknown event, or stops at it, does not surface the status
          update.
        spec_ref: "docs/specification.md#323-stream-response"
        level: must
        min_spec_version: "1.1"
        tags: [client, parsing, streaming, forward-compatibility]
        steps:
          - id: parse
            client_response:
              operation: send_streaming_message
              wire_stream:
                - jsonrpc: "2.0"
                  id: "req-008"
                  result:
                    task:
                      id: "task-fc-001"
                      contextId: "ctx-fc-001"
                      status:
                        state: TASK_STATE_WORKING
                      generation: "2"
                - jsonrpc: "2.0"
                  id: "req-008"
                  result:
                    futureEvent:
                      taskId: "task-fc-001"
                      contextId: "ctx-fc-001"
                      detail: "a kind of event added by a later minor version"
                - jsonrpc: "2.0"
                  id: "req-008"
                  result:
                    statusUpdate:
                      taskId: "task-fc-001"
                      contextId: "ctx-fc-001"
                      status:
                        state: TASK_STATE_COMPLETED
                      generation: "3"
            expect_parsed:
              events:
                type: array
                count: 2
                items:
                  - task:
                      id: "task-fc-001"
                      status:
                        state: TASK_STATE_WORKING
                  - status_update:
                      taskId: "task-fc-001"
                      status:
                        state: TASK_STATE_COMPLETED
                      generation: {gte: 3, lte: 3}

      - id: CLIENT-PARSE-009
        name: "Parse a messageUpdate stream event"
        description: >
          Verifies the client can parse a subscription stream that carries a
          messageUpdate event, the A2A 1.1 event that reports a client message
          added to the task. The stream is a task snapshot followed by the
          messageUpdate, and the client must surface both, with the task id,
          context id, message and generation of the update.
        spec_ref: "docs/specification.md#328-task-timeline-semantics"
        level: must
        min_spec_version: "1.1"
        tags: [client, parsing, streaming, message-update]
        steps:
          - id: parse
            client_response:
              operation: subscribe_to_task
              wire_stream:
                - jsonrpc: "2.0"
                  id: "req-009"
                  result:
                    task:
                      id: "task-mu-001"
                      contextId: "ctx-mu-001"
                      status:
                        state: TASK_STATE_INPUT_REQUIRED
                      generation: "2"
                - jsonrpc: "2.0"
                  id: "req-009"
                  result:
                    messageUpdate:
                      taskId: "task-mu-001"
                      contextId: "ctx-mu-001"
                      message:
                        messageId: "msg-mu-1"
                        taskId: "task-mu-001"
                        contextId: "ctx-mu-001"
                        role: ROLE_USER
                        parts:
                          - text: "here is more input"
                      generation: "3"
            expect_parsed:
              events:
                type: array
                count: 2
                items:
                  - task:
                      id: "task-mu-001"
                  - message_update:
                      taskId: "task-mu-001"
                      contextId: "ctx-mu-001"
                      message:
                        messageId: "msg-mu-1"
                        role: ROLE_USER
                        parts:
                          - text: "here is more input"
                      generation: {gte: 3, lte: 3}

      - id: CLIENT-PARSE-010
        name: "Client skips a timeline entry of an unknown kind and still parses the task"
        description: >
          Verifies that a client which meets a timeline entry of a kind it does not
          know skips that entry instead of rejecting the timeline or the task. The
          task carries a client message entry, an agent status entry, and a third
          entry of a kind no A2A version defines, followed by the task generation.
          The client must parse the task, including both known entries in order
          and the fields that follow the timeline.
        spec_ref: "docs/specification.md#328-task-timeline-semantics"
        level: must
        min_spec_version: "1.1"
        tags: [client, parsing, timeline, forward-compatibility]
        steps:
          - id: parse
            client_response:
              operation: get_task
              wire_payload:
                jsonrpc: "2.0"
                id: "req-010"
                result:
                  id: "task-future-entry-001"
                  contextId: "ctx-future-entry-001"
                  status:
                    state: TASK_STATE_WORKING
                  timeline:
                    - message:
                        messageId: "msg-future-entry-1"
                        role: ROLE_USER
                        parts:
                          - text: "please start"
                      generation: "2"
                    - status:
                        state: TASK_STATE_WORKING
                        message:
                          messageId: "msg-future-entry-2"
                          role: ROLE_AGENT
                          parts:
                            - text: "working on it"
                      generation: "3"
                    - futureEntry:
                        detail: "a kind of timeline entry added by a later minor version"
                      generation: "4"
                  generation: "4"
            expect_parsed:
              id: "task-future-entry-001"
              contextId: "ctx-future-entry-001"
              status:
                state: TASK_STATE_WORKING
              generation: {gte: 4, lte: 4}
              timeline:
                type: array
                count_gte: 2
                items:
                  - message:
                      messageId: "msg-future-entry-1"
                      role: ROLE_USER
                    generation: {gte: 2, lte: 2}
                  - status:
                      state: TASK_STATE_WORKING
                    generation: {gte: 3, lte: 3}

      - id: CLIENT-PARSE-011
        name: "Parse a StreamError event"
        description: >
          Verifies the client can parse a live exchange stream that carries a
          StreamError, the event that rejects one client request without ending
          the stream. The stream is a task snapshot, a StreamError that names the
          rejected message, and a status update that completes the task. The
          client must surface all three in order and must not end the stream at
          the error. Tentative because the binding sections of the A2A text do not
          yet define SendLiveMessage, so the framing of these events is open.
        spec_ref: "specification/a2a.proto: message StreamError"
        level: must
        min_spec_version: "1.1"
        tags: [client, parsing, streaming, live, tentative]
        origin: "https://github.com/a2aproject/A2A/pull/2411"
        steps:
          - id: parse
            client_response:
              operation: send_live_message
              wire_stream:
                - jsonrpc: "2.0"
                  id: "req-011"
                  result:
                    task:
                      id: "task-se-001"
                      contextId: "ctx-se-001"
                      status:
                        state: TASK_STATE_WORKING
                      generation: "2"
                - jsonrpc: "2.0"
                  id: "req-011"
                  result:
                    error:
                      taskId: "task-se-001"
                      code: "INVALID_ARGUMENT"
                      message: "the message was rejected"
                      referenceId: "msg-se-rejected"
                - jsonrpc: "2.0"
                  id: "req-011"
                  result:
                    statusUpdate:
                      taskId: "task-se-001"
                      contextId: "ctx-se-001"
                      status:
                        state: TASK_STATE_COMPLETED
                      generation: "3"
            expect_parsed:
              events:
                type: array
                count: 3
                items:
                  - task:
                      id: "task-se-001"
                  - error:
                      taskId: "task-se-001"
                      code: "INVALID_ARGUMENT"
                      referenceId: "msg-se-rejected"
                  - status_update:
                      taskId: "task-se-001"
                      status:
                        state: TASK_STATE_COMPLETED
