acts_version: "1.0"
spec_version: "1.0"

metadata:
  title: "Push Notification Configuration"
  description: "Tests for push notification config CRUD and unsupported-server behavior"


suites:
  - id: push-notifications
    name: "Push Notification Configuration"
    tests:
      - id: PUSH-CFG-001
        name: "Set push notification config"
        description: >
          Creates a task, configures push notifications for it, and verifies the
          returned configuration uses the requested webhook URL.
        spec_ref: "specification.md#3.1.7"
        level: may
        preconditions:
          capabilities:
            pushNotifications: true
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-complete-task for push"
            capture:
              taskId: "task.id"
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create.taskId}}"
              url: "{{webhookUrl}}"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string
                url: "{{webhookUrl}}"
            capture:
              configId: "id"

      - id: PUSH-CFG-002
        name: "Get push notification config"
        description: >
          Creates a task, stores a push notification configuration, retrieves it,
          and verifies the previously set configuration is returned.
        spec_ref: "specification.md#3.1.8"
        level: may
        preconditions:
          capabilities:
            pushNotifications: true
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-complete-task for push"
            capture:
              taskId: "task.id"
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create.taskId}}"
              url: "{{webhookUrl}}"
            capture:
              configId: "id"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string

          - id: get-config
            operation: get_push_config
            params:
              taskId: "{{create.taskId}}"
              id: "{{set-config.configId}}"
            expect:
              status: 200
              body:
                id: "{{set-config.configId}}"
                url: "{{webhookUrl}}"

      - id: PUSH-CFG-003
        name: "Delete push notification config"
        description: >
          Creates a task, stores a push notification configuration, deletes it,
          and expects a successful deletion response.
        spec_ref: "specification.md#3.1.10"
        level: may
        preconditions:
          capabilities:
            pushNotifications: true
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-complete-task for push"
            capture:
              taskId: "task.id"
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create.taskId}}"
              url: "{{webhookUrl}}"
            capture:
              configId: "id"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string

          - id: delete-config
            operation: delete_push_config
            params:
              taskId: "{{create.taskId}}"
              id: "{{set-config.configId}}"
            expect:
              status:
                gte: 200
                lt: 300

      - id: PUSH-CFG-004
        name: "Push config on unsupported server returns PushNotificationNotSupportedError"
        description: >
          Creates a task on a server that does not advertise push notification
          support, then verifies setting a push notification configuration fails.
        spec_ref: "specification.md#3.1.7"
        level: may
        preconditions:
          capabilities:
            pushNotifications: false
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-complete-task for push"
            capture:
              taskId: "task.id"
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create.taskId}}"
              url: "{{webhookUrl}}"
            expect_error:
              error_type: PushNotificationNotSupportedError

      - id: PUSH-LIST-001
        name: "List push configs"
        level: may
        preconditions:
          capabilities:
            pushNotifications: true
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-complete-task for push"
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string
            capture:
              taskId: "task.id"

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create.taskId}}"
              url: "{{webhookUrl}}"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string
            capture:
              configId: "id"

          - id: list-configs
            operation: list_push_configs
            params:
              taskId: "{{create.taskId}}"
            expect:
              status: 200
              body:
                configs:
                  type: array
                  count_gte: 1

      - id: PUSH-ERR-001
        name: "Get nonexistent push config returns error"
        level: may
        preconditions:
          capabilities:
            pushNotifications: true
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-complete-task for push"
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string
            capture:
              taskId: "task.id"

          - id: get-config
            operation: get_push_config
            params:
              taskId: "{{create.taskId}}"
              id: "00000000-0000-0000-0000-000000000000"
            expect_error:
              error_type: TaskNotFoundError

      - id: PUSH-IDEM-001
        name: "Delete push config is idempotent"
        level: may
        preconditions:
          capabilities:
            pushNotifications: true
        requires_behaviors: ["tck-complete-task"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-complete-task for push"
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string
            capture:
              taskId: "task.id"

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create.taskId}}"
              url: "{{webhookUrl}}"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string
            capture:
              configId: "id"

          - id: delete-config
            operation: delete_push_config
            params:
              taskId: "{{create.taskId}}"
              id: "{{set-config.configId}}"
            expect:
              status:
                gte: 200
                lt: 300

          - id: delete-config-again
            operation: delete_push_config
            params:
              taskId: "{{create.taskId}}"
              id: "{{set-config.configId}}"
            expect:
              status:
                gte: 200
                lt: 300

      - id: PUSH-DELIV-001
        name: "Push delivery includes auth"
        description: "Runner MUST set up a webhook endpoint and verify auth credentials are included."
        level: may
        tags: [push, delivery, runner-special]
        runner_requirements: [webhook_endpoint]
        preconditions:
          capabilities:
            pushNotifications: true
        requires_behaviors: ["tck-long-running"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-long-running start"
              configuration:
                returnImmediately: true
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string
            capture:
              taskId: "task.id"

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create.taskId}}"
              url: "{{webhookUrl}}"
              token: "acts-push-token"
              authentication:
                scheme: "Bearer"
                credentials: "test-token"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string

          - id: delivered-with-credentials
            description: >
              The substance of the test. Registering a config proves only
              that the config API works; whether the SUT then authenticates
              what it pushes is visible nowhere but at the receiver.

              `Authorization` rather than the token header: §4.3.3 mandates
              the former and defines no header at all for
              `PushNotificationConfig.token`.
            expect_webhook:
              task_id: "{{create.taskId}}"
              min_count: 1
              headers:
                Authorization: "Bearer test-token"

      - id: PUSH-DELIV-002
        name: "Push delivery is at-least-once"
        description: "Runner MUST set up a webhook endpoint and verify at-least-once delivery semantics."
        level: may
        runner_requirements: [webhook_endpoint]
        tags: [push, delivery, runner-special]
        preconditions:
          capabilities:
            pushNotifications: true
        requires_behaviors: ["tck-long-running"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-long-running start"
              configuration:
                returnImmediately: true
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string
            capture:
              taskId: "task.id"

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create.taskId}}"
              url: "{{webhookUrl}}"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string

          - id: delivered-at-least-once
            description: >
              At-least-once is a claim about delivery, so the only place it
              can be observed is the receiver. A config accepted and never
              acted on satisfies every other step in this test.
            expect_webhook:
              task_id: "{{create.taskId}}"
              min_count: 1

      - id: PUSH-DELIV-003
        name: "Push payload format correct"
        description: "Runner MUST set up a webhook endpoint and verify the delivered payload format matches the A2A specification."
        runner_requirements: [webhook_endpoint]
        level: may
        tags: [push, delivery, runner-special]
        preconditions:
          capabilities:
            pushNotifications: true
        requires_behaviors: ["tck-long-running"]
        steps:
          - id: create
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-long-running start"
              configuration:
                returnImmediately: true
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string
            capture:
              taskId: "task.id"

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create.taskId}}"
              url: "{{webhookUrl}}"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string

          - id: delivered-payload-is-a2a-shaped
            description: >
              The payload format is the subject, and it appears in no
              response. A2A pushes the task event itself, so the delivery must
              be one of the discriminated event shapes and must name the task
              it is about — a whole Task or a status update, as §7 allows for
              any event.
            expect_webhook:
              task_id: "{{create.taskId}}"
              min_count: 1
              each_event:
                any_of:
                  - task:
                      id: "{{create.taskId}}"
                      status:
                        state:
                          type: string
                  - statusUpdate:
                      taskId: "{{create.taskId}}"
                      status:
                        state:
                          type: string
