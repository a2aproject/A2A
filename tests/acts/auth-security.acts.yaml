acts_version: "1.0"
spec_version: "1.0"

metadata:
  title: "Authentication and Security"
  description: "ACTS coverage for authentication, authorization, and security-sensitive behaviors that require runner-managed credentials or webhooks."

suites:
  - id: auth-security
    name: "Authentication and Security"
    tests:
      - id: SEC-AUTH-001
        name: "Server rejects invalid or missing auth credentials"
        description: "Runner MUST attempt a SendMessage request without valid credentials and verify rejection."
        spec_ref: "REQ-ERR-002"
        level: must
        preconditions:
          authentication: true
        tags: [auth, runner-special]
        transport: [jsonrpc]
        steps:
          - id: send-with-auth
            description: >
              Positive control. The same operation on the same endpoint must
              succeed when the runner presents its credential, so that the
              rejection below is attributable to the absent credential rather
              than to the server refusing the request for a reason of its own.
              Only the status is asserted: what the agent replies with is the
              subject of the CORE-SEND tests, not of this one.
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "auth positive control"
            expect:
              status: 200

          - id: send-without-auth
            raw:
              method: POST
              path: "/"
              headers:
                Content-Type: application/json
                A2A-Version: "1.0"
              body:
                jsonrpc: "2.0"
                id: "sec-auth-001"
                method: SendMessage
                params:
                  message:
                    messageId: "sec-auth-001-msg"
                    role: ROLE_USER
                    parts:
                      - text: "auth should be required"
            expect:
              status:
                one_of: [200, 401, 403]
              body:
                error:
                  exists: true

      - id: SEC-AUTH-002
        name: "Server returns authorization error for insufficient permissions"
        description: "Runner MUST attempt a request with valid but insufficient credentials and verify rejection."
        spec_ref: "REQ-ERR-003"
        level: must
        preconditions:
          authentication: true
        tags: [auth, runner-special]
        runner_requirements: [auth_credentials]
        transport: [jsonrpc]
        steps:
          - id: send-with-sufficient-auth
            description: >
              Positive control, distinguishing a server that authorizes on the
              presented credential from one that refuses everything. The runner's
              own credential must be accepted before the insufficient one below
              can be said to have been rejected for insufficiency.
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "auth positive control"
            expect:
              status: 200

          - id: send-insufficient-auth
            raw:
              method: POST
              path: "/"
              headers:
                Content-Type: application/json
                A2A-Version: "1.0"
                Authorization: "Bearer {{insufficientAuthToken}}"
              body:
                jsonrpc: "2.0"
                id: "sec-auth-002"
                method: SendMessage
                params:
                  message:
                    messageId: "sec-auth-002-msg"
                    role: ROLE_USER
                    parts:
                      - text: "authorization should fail"
            expect:
              status:
                one_of: [200, 403]
              body:
                error:
                  exists: true

      - id: SEC-AUTH-003
        name: "Server does not reveal unauthorized resource existence"
        description: "Runner MUST verify that getting a task belonging to another user returns the same error as getting a nonexistent task."
        spec_ref: "REQ-ERR-004"
        level: must
        preconditions:
          authentication: true
        tags: [auth, security, runner-special]
        runner_requirements: [auth_credentials]
        steps:
          - id: get-other-user-task
            description: >
              A task the client is not authorized to see must be reported as not
              found, never as a permission failure: naming the error after the
              authorization decision is itself the disclosure the requirement
              forbids.
            operation: get_task
            params:
              id: "{{otherUserTaskId}}"
            expect_error:
              error_type: TaskNotFoundError
              message:
                type: string

          - id: get-missing-task
            description: >
              The same error for a task that genuinely does not exist, so the two
              answers agree on the error the client is given.
            operation: get_task
            params:
              id: "00000000-0000-0000-0000-000000000000"
            expect_error:
              error_type: TaskNotFoundError
              message:
                type: string

      - id: SEC-AUTH-004
        name: "Server authenticates every incoming request"
        description: "Runner MUST verify that unauthenticated requests to all endpoints are rejected."
        spec_ref: "REQ-SEC-004"
        level: must
        preconditions:
          authentication: true
        tags: [auth, runner-special]
        transport: [jsonrpc]
        steps:
          - id: get-task-with-auth
            description: >
              Positive control. Asking for the same absent task with a credential
              must reach the resource layer and be answered `TaskNotFoundError`,
              which is what separates "the credential was rejected" below from
              "this endpoint refuses everything".
            operation: get_task
            params:
              id: "00000000-0000-0000-0000-000000000000"
            expect_error:
              error_type: TaskNotFoundError

          - id: get-task-without-auth
            raw:
              method: POST
              path: "/"
              headers:
                Content-Type: application/json
                A2A-Version: "1.0"
              body:
                jsonrpc: "2.0"
                id: "sec-auth-004"
                method: GetTask
                params:
                  id: "00000000-0000-0000-0000-000000000000"
            expect:
              status:
                one_of: [200, 401, 403]
              body:
                error:
                  exists: true

      - id: SEC-AUTH-005
        name: "In-task auth transitions to AUTH_REQUIRED state"
        description: "Verifies that an in-task authentication challenge transitions the task into TASK_STATE_AUTH_REQUIRED with a status message."
        spec_ref: "REQ-SEC-006"
        level: must
        requires_behaviors:
          - "tck-auth-required"
        tags: [auth, task-state]
        steps:
          - id: send
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-auth-required trigger auth"
            expect:
              status: 200
              body:
                task:
                  status:
                    state: TASK_STATE_AUTH_REQUIRED
                    message:
                      exists: true

      - id: SEC-PUSH-001
        name: "Push notification webhook includes auth credentials"
        description: "Runner MUST set up a webhook and verify auth credentials are present in request headers."
        spec_ref: "REQ-SEC-018"
        level: must
        preconditions:
          capabilities:
            pushNotifications: true
        tags: [auth, push, runner-special]
        runner_requirements: [webhook_endpoint]
        requires_behaviors: ["tck-long-running"]
        steps:
          - id: create-task
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-long-running start"
              configuration:
                returnImmediately: true
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string
            capture:
              taskId: "task.id"

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create-task.taskId}}"
              url: "{{webhookUrl}}"
              token: "acts-push-token"
              authentication:
                scheme: "Bearer"
                credentials: "test-token"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string

          - id: delivery-carries-the-credential
            description: >
              REQ-SEC-018 is about the headers on the request the *SUT*
              makes, which no response can show. Accepting the config proves
              nothing: a server that stores it and pushes anonymously — or
              never pushes — satisfies every other step here.

              The assertion is on `Authorization`, because that is what A2A
              §4.3.3 makes a MUST: "the agent MUST include authentication
              credentials in the request headers as specified in the
              PushNotificationConfig.authentication field". The `token` field
              has no header defined for it anywhere in A2A, so requiring one
              would fail a conformant agent over a convention.
            expect_webhook:
              task_id: "{{create-task.taskId}}"
              min_count: 1
              headers:
                Authorization: "Bearer test-token"

      - id: SEC-PUSH-002
        name: "Client validates push notification webhook authenticity"
        description: "Runner MUST verify that webhook requests with invalid auth are rejected by the client."
        spec_ref: "REQ-SEC-019"
        level: must
        preconditions:
          capabilities:
            pushNotifications: true
        tags: [auth, push, client, runner-special]
        runner_requirements: [webhook_endpoint]
        requires_behaviors: ["tck-long-running"]
        steps:
          - id: create-task
            operation: send_message
            params:
              message:
                role: ROLE_USER
                parts:
                  - text: "tck-long-running start"
              configuration:
                returnImmediately: true
            expect:
              status: 200
              body:
                task:
                  id:
                    type: string
            capture:
              taskId: "task.id"

          - id: set-config
            operation: create_push_config
            params:
              taskId: "{{create-task.taskId}}"
              url: "{{webhookUrl}}"
              token: "acts-expected-token"
              authentication:
                scheme: "Bearer"
                credentials: "expected-token"
            expect:
              status:
                gte: 200
                lt: 300
              body:
                id:
                  type: string

          - id: delivery-carries-the-configured-credential
            description: >
              The client-side half of REQ-SEC-019 — rejecting a forged
              webhook call — is not something a conformance runner can drive
              against the SUT. What it can check is the precondition that
              makes rejection possible at all: the agent must present the
              credential it was configured with, and present *that* one
              rather than something of its own, so a receiver has a value to
              compare against.
            expect_webhook:
              task_id: "{{create-task.taskId}}"
              min_count: 1
              headers:
                Authorization: "Bearer expected-token"

      - id: SEC-EXTCARD-001
        name: "Extended Agent Card requires authentication"
        description: "Verifies that fetching the extended Agent Card without authentication is rejected."
        spec_ref: "REQ-SEC-021"
        level: must
        preconditions:
          capabilities:
            extendedAgentCard: true
        tags: [auth, discovery, runner-special]
        transport: [rest]
        steps:
          - id: get-extended-card-with-auth
            description: >
              Positive control. The runner presents its credential on an
              abstract operation (§12.4), so the same endpoint must answer
              this one — otherwise the rejection below is attributable to a
              server that refuses everything here, or to no such route at
              all, rather than to the absent credential.
            operation: get_extended_agent_card
            expect:
              status: 200

          - id: get-extended-card-without-auth
            raw:
              method: GET
              path: "/extendedAgentCard"
              headers:
                Accept: application/json
                A2A-Version: "1.0"
            expect:
              status:
                one_of: [401, 403]
              body:
                error:
                  exists: true

      - id: SEC-EXTCARD-002
        name: "Extended Agent Card verifies permissions before returning"
        description: "Runner MUST verify that an authenticated request with insufficient permissions is rejected."
        spec_ref: "REQ-SEC-022"
        level: must
        preconditions:
          capabilities:
            extendedAgentCard: true
        tags: [auth, discovery, runner-special]
        runner_requirements: [auth_credentials]
        transport: [rest]
        steps:
          - id: get-extended-card-with-auth
            description: >
              Positive control, as in SEC-EXTCARD-001: a server refusing this
              endpoint outright would otherwise satisfy the rejection below
              without ever having looked at the credential's scope.
            operation: get_extended_agent_card
            expect:
              status: 200

          - id: get-extended-card-insufficient-auth
            raw:
              method: GET
              path: "/extendedAgentCard"
              headers:
                Accept: application/json
                A2A-Version: "1.0"
                Authorization: "Bearer {{insufficientAuthToken}}"
            expect:
              status:
                one_of: [401, 403]
              body:
                error:
                  exists: true

      - id: SEC-EXTCARD-003
        name: "Missing extended-card support returns specified error"
        description: "Verifies that Get Extended Agent Card returns the specified error when the capability is not advertised."
        spec_ref: "REQ-SEC-025"
        level: must
        preconditions:
          capabilities:
            extendedAgentCard: false
        tags: [auth, discovery]
        steps:
          - id: get-extended-card
            operation: get_extended_agent_card
            params: {}
            expect_error:
              error_type: UnsupportedOperationError

      - id: SEC-EXTCARD-004
        name: "Extended cards enforce access controls"
        description: "Runner MUST verify that extended Agent Cards enforce access controls consistently with the registered endpoint."
        spec_ref: "REQ-IANA-008"
        level: must
        preconditions:
          capabilities:
            extendedAgentCard: true
        tags: [auth, discovery, runner-special]
        transport: [rest]
        steps:
          - id: get-extended-card-with-auth
            description: >
              Positive control, as in SEC-EXTCARD-001.
            operation: get_extended_agent_card
            expect:
              status: 200

          - id: get-extended-card-without-auth
            raw:
              method: GET
              path: "/extendedAgentCard"
              headers:
                Accept: application/json
                A2A-Version: "1.0"
            expect:
              status:
                one_of: [401, 403]
              body:
                error:
                  exists: true

      - id: SEC-AUTH-006
        name: "Server uses binding-specific auth challenge or rejection"
        description: "Runner SHOULD verify that authentication rejection uses the binding-appropriate mechanism, such as HTTP 401 for HTTP transports."
        spec_ref: "REQ-SEC-005"
        level: should
        preconditions:
          authentication: true
        tags: [auth, runner-special]
        transport: [rest]
        steps:
          - id: get-task-with-auth
            description: >
              Positive control, as in SEC-AUTH-004: with a credential the same
              path must reach the resource layer, so that the status asserted
              below is a report about authentication and not about the route.
            operation: get_task
            params:
              id: "00000000-0000-0000-0000-000000000000"
            expect_error:
              error_type: TaskNotFoundError

          - id: get-task-without-auth
            raw:
              method: GET
              path: "/tasks/00000000-0000-0000-0000-000000000000"
              headers:
                Accept: application/json
                A2A-Version: "1.0"
            expect:
              status:
                one_of: [401, 403]
              body:
                error:
                  exists: true
