name: Docs Build Check

# Validates that the documentation builds. Publishing is done by
# docs-publish.yml, which deploys to GitHub Pages using Actions.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-publish.yml"
      - ".github/actions/build-docs/**"
      - "scripts/assemble_site.sh"
      - "scripts/build_docs.sh"
      - "scripts/mount_docs.py"
      - "requirements-docs.txt"
      - "mkdocs.yml"
      - "docs/**"
      - ".mkdocs/**"
      - "specification/a2a.proto"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    if: github.repository == 'a2aproject/A2A'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare docs build
        uses: ./.github/actions/build-docs
        # No mount token on purpose: PR code (scripts, mounts.yml) must not see
        # the bot PAT. Mounts are cloned anonymously (public repos only) and
        # private or failing entries marked `required: false` are skipped.

      - name: Build Documentation
        run: mkdocs build
